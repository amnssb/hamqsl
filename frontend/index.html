<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no, email=no" />
  <!--
    主题配色变量：由后端按当前启用的主题插件生成（CSS 自定义属性）。
    必须是 <link> 而不是内联 <script>：CSP 是 script-src 'self'，内联脚本会被拦，
    而同源样式表不违反 style-src 'self'。放在 app 的 CSS/JS 之前，
    浏览器第一帧就能拿到正确配色 —— 消除"先白一下再变暗"的闪烁。
    详见 docs/performance-and-theme.md 第二部分。
  -->
  <link rel="stylesheet" href="/api/public/theme.css" data-qsl-theme="initial" />
  <title>QSL 卡片管理系统</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
