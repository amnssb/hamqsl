# 镜像构建成功后 SSH 到部署机执行自动更新。
#
# 前提（仓库 Settings → Secrets and variables → Actions 配好三个 Secret）：
#   DEPLOY_HOST    服务器地址（IP 或域名）
#   DEPLOY_USER    SSH 用户（需能免 sudo 跑 docker；或在 docker 组里）
#   DEPLOY_SSH_KEY SSH 私钥（对应的公钥要加到服务器 ~/.ssh/authorized_keys）
#
# 服务器侧另需一次手动初始化（之后全自动）：
#   1. 按部署文档装好并跑通一次：bash deploy.sh
#   2. 把 scripts/update.sh 放到服务器的 /opt/qsl/scripts/update.sh
#      （部署目录默认 /opt/qsl，不同就在下面 env: 里改 DEPLOY_DIR）
#
# 触发链：push main → release.yml 构建 latest → 本 job SSH 执行 update.sh。
# update.sh 自带健康检查与回退，这里只负责可靠地把命令送过去。

name: Auto Deploy

on:
  workflow_run:
    workflows: [Build & Push Image]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    # 只有镜像构建成功才往下走；构建失败/手动取消都不部署
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (for scripts/update.sh)
        uses: actions/checkout@v5

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run update script on server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              'bash /opt/qsl/scripts/update.sh'
        timeout-minutes: 10
