services:
  qsl:
    # 预构建镜像：push 到 main 后由 GitHub Actions 自动构建发布（部署机免编译，秒级拉起）
    image: ghcr.io/amnssb/hamqsl:latest
    # 本地构建兜底：网络拉不动 / 改代码自测时，注释掉上面的 image 并解开下面三行
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: qsl
    restart: unless-stopped
    ports:
      # 只绑回环：宿主 3073 -> 容器 8000，只有本机反代（1Panel/nginx）够得着。
      # 写成 "3073:8000" 等于绑 0.0.0.0，任何人都能绕过 Cloudflare 直连源站，WAF 全成摆设。
      - "127.0.0.1:3073:8000"   # 1Panel 反代目标填 http://127.0.0.1:3073
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      # JWT 密钥：留空则首次启动自动生成并持久化到 data/.jwt_secret（随数据卷保存），
      # 也可自行指定：JWT_SECRET=你的随机长字符串
      # - JWT_SECRET=
      # 初始管理员：ADMIN_PASS 留空则首次启动随机生成并只打印一次（不再有 admin123）。
      # - ADMIN_USER=admin
      # - ADMIN_PASS=
      # 通行密钥（WebAuthn）：两个都配才生效，留空则功能关闭、其余不受影响。
      # 具体值写在同目录的 .env 里（已被 .gitignore 排除），这样仓库保持通用，
      # 在 1Panel 编排里看得到、改也不会和 git pull 打架：
      #   WEBAUTHN_RP_ID=qsl.ba4slt.cn
      #   WEBAUTHN_ORIGINS=https://qsl.ba4slt.cn
      # RP ID 只填域名（不含协议与端口），必须与浏览器地址栏域名一致；
      # 绑定后换域名会让已有密钥全部失效 —— 这是 WebAuthn 的硬约束。
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-}
      # 强制二步验证：true 时未绑定第二因子将无法导出备份、改 SMTP 等敏感操作
      # - REQUIRE_MFA=true
      # 逃生开关：设为 1 启动会清空管理员的通行密钥与二步验证，并重置成一次性随机口令
      # （日志里打印）。用完立刻删掉这行，否则每次重启都会重置。
      # - ADMIN_RESET=1
      # 默认 SQLite，数据落在 ./data；如需 PostgreSQL 再放开下面几行
      # - DB_DRIVER=postgres
      # - DB_HOST=qsl-db
      # - DB_PORT=5432
      # - DB_USER=qsl
      # - DB_PASSWORD=change-me
      # - DB_NAME=qsl
    volumes:
      - ./data:/app/data       # SQLite 数据库：备份/迁移拷这个目录
      - ./uploads:/app/uploads # 上传文件
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
